name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, matching the npm major that generates the lockfile
      # locally. On Node 20 (npm 10) `npm ci` failed with "Missing: esbuild@0.28.2
      # from lock file", because the two majors hoist transitive dependencies
      # differently — npm 11 records esbuild nested under tsx, npm 10 expects it
      # at the top level. Keeping the majors aligned keeps the lockfile portable.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npx vitest run

      # No secrets are provided on purpose. Nothing in the build may read the
      # database or the mail config: DATABASE_URL is optional in the env schema and
      # asserted at point of use, the db client is lazily constructed, and no route
      # reads the database at build time. If this step ever starts needing a
      # secret, that coupling has been reintroduced and should be fixed rather
      # than papered over by adding the secret here.
      - name: Build
        run: npm run build
